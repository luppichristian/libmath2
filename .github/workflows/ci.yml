name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up CMake
      uses: lukka/get-cmake@latest
    
    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DLM2_BUILD_TESTS=ON
    
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}
    
    - name: Run tests
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure --verbose
    
    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          build/Testing/Temporary/LastTest.log
          build/Testing/Temporary/LastTestsFailed.log
        if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up CMake
      uses: lukka/get-cmake@latest

    - name: Install LLVM
      run: |
        sudo apt-get update
        sudo apt-get install --yes clang llvm

    - name: Configure coverage build
      run: |
        cmake -B build-coverage \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DLM2_BUILD_TESTS=ON \
          -DCMAKE_C_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
          -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
          -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate"

    - name: Build
      run: cmake --build build-coverage --parallel

    - name: Run tests
      env:
        LLVM_PROFILE_FILE: ${{ github.workspace }}/build-coverage/profiles/%p.profraw
      run: |
        cmake -E make_directory build-coverage/profiles
        ctest --test-dir build-coverage --output-on-failure

    - name: Generate coverage report
      run: |
        llvm-profdata merge --sparse build-coverage/profiles/*.profraw \
          --output build-coverage/coverage.profdata
        llvm-cov export build-coverage/libmath2-tests \
          --instr-profile build-coverage/coverage.profdata \
          --summary-only \
          --ignore-filename-regex='(^|/)(tests|include|build-coverage|_deps)/' \
          > coverage.json
        llvm-cov report build-coverage/libmath2-tests \
          --instr-profile build-coverage/coverage.profdata \
          --ignore-filename-regex='(^|/)(tests|include|build-coverage|_deps)/' \
          | tee coverage.txt
        python - <<'PY'
        import json
        import sys

        with open("coverage.json", encoding="utf-8") as report:
          totals = json.load(report)["data"][0]["totals"]

        line_coverage = totals["lines"]["percent"]
        branch_coverage = totals["branches"]["percent"]
        print(f"Line coverage: {line_coverage:.2f}%")
        print(f"Branch coverage: {branch_coverage:.2f}%")

        if line_coverage < 55.0 or branch_coverage < 45.0:
          sys.exit("Coverage is below the required 55% line / 45% branch floor")
        PY

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage.json
          coverage.txt
